<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="header">
    <h1 class="title">Personal Finance Dashboard</h1>
  </header>

  <main class="main">
    <!-- Summary Cards -->
    <section class="summary-cards">
      <div class="card" id="card-balance">
        <h2 class="card-title">Balance</h2>
        <p class="card-value" data-key="totalBalance">$0.00</p>
      </div>
      <div class="card" id="card-income">
        <h2 class="card-title">Income</h2>
        <p class="card-value" data-key="totalIncome">$0.00</p>
      </div>
      <div class="card" id="card-expenses">
        <h2 class="card-title">Expenses</h2>
        <p class="card-value" data-key="totalExpenses">$0.00</p>
      </div>
      <div class="card" id="card-savings">
        <h2 class="card-title">Savings</h2>
        <p class="card-value" data-key="totalSavings">$0.00</p>
      </div>
    </section>

    <!-- Category Filter Buttons -->
    <section class="filter-group" id="filter-group">
      <button class="filter-btn active" data-category="All">All</button>
      <button class="filter-btn" data-category="Food">Food</button>
      <button class="filter-btn" data-category="Transport">Transport</button>
      <button class="filter-btn" data-category="Entertainment">Entertainment</button>
      <button class="filter-btn" data-category="Utilities">Utilities</button>
      <button class="filter-btn" data-category="Salary">Salary</button>
      <button class="filter-btn" data-category="Freelance">Freelance</button>
    </section>

    <!-- Charts -->
    <section class="charts">
      <div class="chart-card">
        <h2 class="chart-title">Spending by Category</h2>
        <canvas id="barChart"></canvas>
      </div>
      <div class="chart-card">
        <h2 class="chart-title">Monthly Trend</h2>
        <canvas id="lineChart"></canvas>
      </div>
    </section>
  </main>

  <script src="script.js" type="module"></script>
</body>
</html>
