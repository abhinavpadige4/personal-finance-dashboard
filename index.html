<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="header">
    <h1 class="title">Personal Finance Dashboard</h1>
  </header>

  <main class="main">
    <!-- Summary Cards -->
    <section class="summary-section">
      <div class="summary-card" id="card-balance">
        <h2 class="card-title">Total Balance</h2>
        <p class="card-value" data-key="totalBalance">$0.00</p>
      </div>
      <div class="summary-card" id="card-income">
        <h2 class="card-title">Income</h2>
        <p class="card-value" data-key="totalIncome">$0.00</p>
      </div>
      <div class="summary-card" id="card-expenses">
        <h2 class="card-title">Expenses</h2>
        <p class="card-value" data-key="totalExpenses">$0.00</p>
      </div>
      <div class="summary-card" id="card-savings">
        <h2 class="card-title">Savings</h2>
        <p class="card-value" data-key="totalSavings">$0.00</p>
      </div>
    </section>

    <!-- Category Filters -->
    <section class="filter-section">
      <div class="filter-group" id="category-filters">
        <!-- Buttons will be injected by script.js -->
      </div>
    </section>

    <!-- Charts -->
    <section class="charts-section">
      <div class="chart-card">
        <h2 class="chart-title">Spending by Category</h2>
        <canvas id="spendingBarChart"></canvas>
      </div>
      <div class="chart-card">
        <h2 class="chart-title">Monthly Trend</h2>
        <canvas id="trendLineChart"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
