<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header class="header">
    <h1 class="title">Personal Finance Dashboard</h1>
    <span class="current-month" id="currentMonth"></span>
  </header>

  <main class="container">
    <section id="summary" class="summary-grid">
      <div class="summary-card" id="card-balance">
        <div class="card-label">Total Balance</div>
        <div class="card-value" data-key="totalBalance"></div>
        <div class="card-delta" data-delta="balance"></div>
      </div>
      <div class="summary-card" id="card-income">
        <div class="card-label">Income</div>
        <div class="card-value" data-key="income"></div>
        <div class="card-delta" data-delta="income"></div>
      </div>
      <div class="summary-card" id="card-expenses">
        <div class="card-label">Expenses</div>
        <div class="card-value" data-key="expenses"></div>
        <div class="card-delta" data-delta="expenses"></div>
      </div>
      <div class="summary-card" id="card-savings">
        <div class="card-label">Savings</div>
        <div class="card-value" data-key="savings"></div>
        <div class="card-delta" data-delta="savings"></div>
      </div>
    </section>

    <section id="filters" class="filter-row"></section>

    <section id="charts" class="charts-grid">
      <div class="chart-card">
        <h3>Spending by Category</h3>
        <canvas id="barChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Monthly Trends</h3>
        <canvas id="lineChart"></canvas>
      </div>
    </section>
  </main>
</body>
</html>
