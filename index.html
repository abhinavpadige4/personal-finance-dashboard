<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script type="module" src="script.js" defer></script>
</head>
<body class="bg-background text-text font-base">
  <header class="p-md border-b border-border bg-surface shadow-sm">
    <h1 class="text-2xl font-bold">Finance Dashboard</h1>
  </header>

  <main class="p-md space-y-lg">
    <!-- Summary Cards -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-md" id="summary-cards">
      <article class="card" id="card-balance">
        <h2 class="card-title">Total Balance</h2>
        <p class="card-value" data-key="totalBalance"></p>
      </article>
      <article class="card" id="card-income">
        <h2 class="card-title">Income</h2>
        <p class="card-value" data-key="totalIncome"></p>
      </article>
      <article class="card" id="card-expenses">
        <h2 class="card-title">Expenses</h2>
        <p class="card-value" data-key="totalExpenses"></p>
      </article>
      <article class="card" id="card-savings">
        <h2 class="card-title">Savings</h2>
        <p class="card-value" data-key="totalSavings"></p>
      </article>
    </section>

    <!-- Category Filters -->
    <section class="flex flex-wrap gap-sm" id="category-filters" role="group" aria-label="Category filter buttons">
      <!-- Buttons injected by script.js -->
    </section>

    <!-- Charts -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-lg">
      <article class="chart-card">
        <h2 class="chart-title">Spending by Category</h2>
        <canvas id="categoryBarChart" aria-label="Bar chart of spending by category" role="img"></canvas>
      </article>
      <article class="chart-card">
        <h2 class="chart-title">Monthly Trend</h2>
        <canvas id="monthlyLineChart" aria-label="Line chart of monthly income/expenses" role="img"></canvas>
      </article>
    </section>
  </main>
</body>
</html>
